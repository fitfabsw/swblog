name: Deploy to cpdx-sw

on:
  push:
    branches:
      - fit-cpd-sw

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build
        run: hugo --minify --baseURL "http://10.35.40.81/swblog/"

      - name: Deploy
        run: |
          rm -rf /var/www/swblog/*
          cp -r public/* /var/www/swblog/
